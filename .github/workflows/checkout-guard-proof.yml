name: checkout guard proof

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  poison:
    if: github.event.pull_request.head.repo.full_name == 'Porche12/checkout-guard-proof-fork2'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the owned test branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}.git
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Execute the fork-controlled proof script
        run: node proof.js

      - name: Upload the fork-controlled payload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: guard-proof-${{ github.run_id }}
          path: proof-cache/payload.cjs
          if-no-files-found: error

  consume:
    needs: poison
    runs-on: ubuntu-latest
    permissions:
      contents: none
    steps:
      - name: Download the artifact in a separate job
        uses: actions/download-artifact@v8.0.2
        with:
          name: guard-proof-${{ github.run_id }}
          path: proof-cache

      - name: Execute the restored fork-controlled payload
        run: node proof-cache/payload.cjs
