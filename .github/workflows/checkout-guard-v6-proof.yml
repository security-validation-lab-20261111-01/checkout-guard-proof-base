name: checkout guard v6 proof

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  poison:
    if: github.event.pull_request.head.repo.full_name == 'Porche12/checkout-guard-proof-fork2'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the owned test branch through the alias
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}.git
          ref: ${{ github.event.pull_request.head.ref }}
          allow-unsafe-pr-checkout: false
          persist-credentials: false

      - name: Execute the fork-controlled proof script
        run: node proof.js

      - name: Upload the fork-controlled payload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: guard-v6-proof-${{ github.run_id }}
          path: proof-cache/payload.cjs
          if-no-files-found: error

  canonical-control:
    if: github.event.pull_request.head.repo.full_name == 'Porche12/checkout-guard-proof-fork2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out with the canonical repository input
        id: guard
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        continue-on-error: true
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          allow-unsafe-pr-checkout: false
          persist-credentials: false

      - name: Confirm the canonical input was refused
        if: steps.guard.outcome == 'failure'
        run: echo 'canonical owner/repository input was blocked by the guard'

      - name: Fail if the canonical input was accepted
        if: steps.guard.outcome == 'success'
        run: exit 1

  consume:
    needs: poison
    runs-on: ubuntu-latest
    permissions:
      contents: none
    steps:
      - name: Download the artifact in a separate job
        uses: actions/download-artifact@v8.0.2
        with:
          name: guard-v6-proof-${{ github.run_id }}
          path: proof-cache

      - name: Execute the restored fork-controlled payload
        run: node proof-cache/payload.cjs
